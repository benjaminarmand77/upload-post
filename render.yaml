# Render Blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: upload-post
    runtime: docker
    plan: starter            # a persistent disk requires a paid instance
    region: frankfurt
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: upload-post-data
      mountPath: /data
      sizeGB: 5
    envVars:
      - key: DATA_DIR
        value: /data
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "10000"
      - key: APP_SECRET
        generateValue: true
      - key: SITE_URL
        sync: false          # set to https://<your-service>.onrender.com (or your domain) in the dashboard
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
